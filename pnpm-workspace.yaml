packages:
  - cloudflare-os/packages/workshop-shared
  - cloudflare-os/packages/error-reporting
  # Upstream turned its shared build tooling into the @gadgets/scripts package
  # (cloudflare-os/scripts), which error-reporting now depends on via `workspace:*`.
  - cloudflare-os/scripts
  - packages/*

# Mirror of cloudflare-os/pnpm-workspace.yaml's catalog. Required, not merely tidy: the two
# submodule packages above are members of THIS workspace, and both declare `catalog:` specifiers
# that resolve here rather than in the submodule -- without these entries `pnpm install` fails
# outright.
#
# Keep every shared entry byte-identical to the submodule's when bumping the gitlink. Drift is
# silent: the starter and the submodule install separately, so a different capnweb range gives the
# tree two copies, and a stub minted by one is unserialisable by the other's session
# (`TypeError: Cannot serialize value: [object RpcStub]`). A deduped dev machine hides it; the
# split installs in CI and on a fresh checkout do not. See
# cloudflare-os/docs/integration-testing.md.
catalog:
  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@cloudflare/workers-types': ^5.20260903.1
  capnweb: ^0.12.0
  # jsdiff: line diffs in workshop-backend (formatUnifiedDiff) and gatekeeper-github (the
  # simulated PR diff's hunks). Mirrored from the submodule's catalog.
  diff: ^8.0.4
  # Exact: pinned in lockstep with capnweb (declared as a >=0.7.0 peer)
  capnweb-validate: 0.3.0
  # Exact: a prerelease, kept in step with the Wrangler/workerd stack the test pool runs on.
  miniflare: 5.20260921.1-alpha
  # Exact: TypeScript 7 (tsgo). The submodule's tsconfig sets `singleThreaded`, which TS 5.9
  # rejects outright, so every package extending it has to be on 7.x.
  typescript: 7.0.2
  # Exact: the JS compiler API ("typescript" 7 no longer ships it), aliased so it can sit beside
  # tsgo. Required here because cloudflare-os/scripts, a member of this workspace, declares it.
  typescript6: npm:typescript@6.0.3
  # Exact, not ranged: the transform has to stay on esbuild. Oxc does not lower the Stage-3
  # decorators capnweb-validate's `@validateRpc()` relies on (cloudflare/workers-sdk#12626).
  vite: 7.3.6
  vite-plus: ^0.2.8
  vitest: ^4.1.11
  wrangler: ^4.138.0
  zod: ^4.5.4

overrides:
  # Keep the test pool's Wrangler/Miniflare/workerd stack aligned with the workspace toolchain.
  '@cloudflare/vitest-pool-workers>miniflare': "catalog:"
  '@cloudflare/vitest-pool-workers>wrangler': "catalog:"
  # Vitest peers can resolve vite@latest, so the version is pinned rather than ranged. Points at the
  # catalog so this and the manifests can't disagree: a catalog only covers what a workspace
  # manifest declares itself, and the override is what reaches vite as somebody else's peer.
  vite: "catalog:"
  # Arrives as an optional vite/vitest peer resolved to `latest`; pinned to the same release the
  # submodule pins so the two installs agree.
  '@types/node': 26.1.0
  # Deep transitive of @codemirror/lang-markdown; pinned to the last mature release, matching
  # the submodule (its minimumReleaseAge gate doesn't cover transitive peers).
  '@lezer/markdown': 1.6.4

allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
